<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>Keranamu Malaysia 🇲🇾</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   START
========================= */

#start {
  position: fixed;
  inset: 0;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;

  background: #061a40;
  color: white;
}

.flag {
  font-size: 22vw;
}

#start h1 {
  margin: 10px 15px;
  font-size: 9vw;
}

#start p {
  margin: 10px 20px;
  font-size: 4.5vw;
  opacity: 0.75;
}

button {
  margin-top: 25px;

  padding: 18px 50px;

  border: none;
  border-radius: 100px;

  background: white;
  color: #061a40;

  font-size: 7vw;
  font-weight: 900;

  cursor: pointer;
}

/* =========================
   MAIN SCREEN
========================= */

#screen {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: black;
  color: white;

  transition: background 0.35s ease;
}

/* =========================
   ERROR TEXT
========================= */

#error {
  width: 100%;
  padding: 8vw;

  font-family: monospace;
  font-size: 5vw;
  line-height: 1.5;

  color: #00ff41;
}

.errorTitle {
  font-size: 11vw;
  font-weight: 900;
}

/* =========================
   GLITCH
========================= */

.glitch {
  animation: glitch 0.14s infinite;
}

@keyframes glitch {

  0% {
    transform: translate(0);
  }

  20% {
    transform: translate(-5px, 3px);
  }

  40% {
    transform: translate(6px, -3px);
  }

  60% {
    transform: translate(-4px, 4px);
  }

  80% {
    transform: translate(5px, -2px);
  }

  100% {
    transform: translate(0);
  }
}

/* =========================
   MAIN WORD
========================= */

#word {
  position: absolute;

  width: 100%;

  text-align: center;

  white-space: nowrap;

  font-size: 20vw;
  font-weight: 900;

  text-shadow:
    4px 4px 12px rgba(0,0,0,0.35);
}

/* =========================
   SCROLLING WORD
========================= */

.scroll {
  animation: scrollText 3s linear infinite;
}

@keyframes scrollText {

  from {
    transform: translateX(120vw);
  }

  to {
    transform: translateX(-120vw);
  }
}

/* =========================
   FADE
========================= */

.fade {
  animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {

  from {
    opacity: 0;
    transform: scale(0.75);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* =========================
   PULSE
========================= */

.pulse {
  animation: pulse 0.8s ease-in-out infinite alternate;
}

@keyframes pulse {

  from {
    transform: scale(0.9);
  }

  to {
    transform: scale(1.06);
  }
}

</style>
</head>

<body>


<!-- =========================
     START PAGE
========================= -->

<div id="start">

  <div class="flag">
    🇲🇾
  </div>

  <h1>
    KERANAMU MALAYSIA
  </h1>

  <p>
    Tunggu arahan sebelum tekan
  </p>

  <button id="mulaButton">
    MULA
  </button>

</div>


<!-- =========================
     SHOW
========================= -->

<div id="screen">

  <div id="error"></div>

  <div id="word"></div>

</div>


<!-- =========================
     AUDIO
========================= -->

<audio
  id="glitchAudio"
  src="./soundreality-glitch-effect-3-530928.mp3"
  preload="auto"
  playsinline>
</audio>


<script>

const start =
  document.getElementById("start");

const screen =
  document.getElementById("screen");

const errorBox =
  document.getElementById("error");

const word =
  document.getElementById("word");

const glitchAudio =
  document.getElementById("glitchAudio");

const mulaButton =
  document.getElementById("mulaButton");


let colourInterval = null;


/* =========================
   BUTTON
========================= */

mulaButton.addEventListener("click", mula);


/* =========================
   START SHOW
========================= */

function mula() {

  /*
  IMPORTANT:
  Audio starts IMMEDIATELY
  after user presses MULA.
  */

  glitchAudio.volume = 1;
  glitchAudio.currentTime = 0;

  glitchAudio.play()
    .catch(error => {
      console.log("Audio error:", error);
    });


  /* SHOW MAIN SCREEN */

  start.style.display = "none";
  screen.style.display = "flex";


  /* FULL SCREEN */

  if (document.documentElement.requestFullscreen) {

    document.documentElement
      .requestFullscreen()
      .catch(() => {});

  }


  /* =========================
     0:00
     SYSTEM ERROR
  ========================= */

  screen.style.background = "black";

  errorBox.innerHTML = `

    <div class="errorTitle glitch">
      SYSTEM ERROR
    </div>

    CONNECTION LOST...

    <br><br>

    Attempting recovery...

    <br><br>

    [■■□□□□□□□□] 20%

  `;


  /* =========================
     0:01
     IDENTITY NOT FOUND
  ========================= */

  setTimeout(() => {

    errorBox.innerHTML = `

      <div class="errorTitle glitch">
        ERROR 404
      </div>

      IDENTITY NOT FOUND.

      <br><br>

      Searching system...

      <br><br>

      [■■■■■□□□□□] 50%

    `;

  }, 1000);


  /* =========================
     0:02
     JATI DIRI NOT FOUND
  ========================= */

  setTimeout(() => {

    errorBox.innerHTML = `

      <div class="errorTitle glitch">
        CRITICAL ERROR
      </div>

      JATI DIRI NOT FOUND.

      <br><br>

      RECOVERING...

      <br><br>

      [■■■■■■■■□□] 80%

    `;

  }, 2000);


  /* =========================
     0:03
     100%
  ========================= */

  setTimeout(() => {

    errorBox.innerHTML = `

      <div class="errorTitle">
        RECOVERING
      </div>

      SYSTEM RECOVERY...

      <br><br>

      [■■■■■■■■■■] 100%

    `;

  }, 3000);


  /* =========================
     0:04
     FINAL GLITCH
  ========================= */

  setTimeout(() => {

    errorBox.innerHTML = `

      <div class="errorTitle glitch">
        ██████████
      </div>

      REBOOTING...

    `;

  }, 4000);


  /* =========================
     0:05
     STOP AUDIO + BLACKOUT
  ========================= */

  setTimeout(() => {

    /* STOP THE 12 SECOND AUDIO */

    glitchAudio.pause();
    glitchAudio.currentTime = 0;


    /* BLACK SCREEN */

    errorBox.innerHTML = "";
    word.innerHTML = "";

    screen.style.background = "black";

  }, 5000);


  /* =========================
     0:05.5
     SYSTEM RESTORED
  ========================= */

  setTimeout(() => {

    word.style.width = "100%";
    word.style.whiteSpace = "nowrap";

    word.style.fontSize = "10vw";

    word.style.color = "#00ff41";

    word.className = "fade";

    word.innerHTML =
      "SYSTEM RESTORED ✓";

  }, 5500);


  /* =========================
     0:06.5
     MALAYSIA
  ========================= */

  setTimeout(() => {

    word.style.fontSize = "20vw";
    word.style.color = "white";

    word.innerHTML =
      "MALAYSIA";

    word.className =
      "scroll";

    startColours();

  }, 6500);


  /* =========================
     0:09.5
     BERSATU
  ========================= */

  setTimeout(() => {

    word.innerHTML =
      "BERSATU";

  }, 9500);


  /* =========================
     0:12.5
     JATI DIRI
  ========================= */

  setTimeout(() => {

    word.innerHTML =
      "JATI DIRI";

  }, 12500);


  /* =========================
     0:15.5
     FLAG
  ========================= */

  setTimeout(() => {

    stopColours();

    screen.style.background =
      "#0033A0";

    word.style.color =
      "white";

    word.style.fontSize =
      "22vw";

    word.className =
      "pulse";

    word.innerHTML =
      "🇲🇾";

  }, 15500);


  /* =========================
     0:17
     FINAL
  ========================= */

  setTimeout(() => {

    word.style.fontSize =
      "13vw";

    word.style.width =
      "95%";

    word.style.whiteSpace =
      "normal";

    word.innerHTML =
      "KERANAMU<br>MALAYSIA";

  }, 17000);

}


/* =========================
   MALAYSIA COLOURS
========================= */

function startColours() {

  const colours = [

    "#D71920",  // RED
    "#0033A0",  // BLUE
    "#FFD100",  // YELLOW
    "#FFFFFF"   // WHITE

  ];

  let i = 0;


  colourInterval =
    setInterval(() => {

      const colour =
        colours[i];

      screen.style.background =
        colour;


      /* TEXT COLOUR */

      if (
        colour === "#FFD100" ||
        colour === "#FFFFFF"
      ) {

        word.style.color =
          "#061A40";

      }

      else {

        word.style.color =
          "white";

      }


      i =
        (i + 1) %
        colours.length;

    }, 1000);

}


/* =========================
   STOP COLOURS
========================= */

function stopColours() {

  if (colourInterval) {

    clearInterval(
      colourInterval
    );

    colourInterval = null;

  }

}

</script>

</body>
</html>
