<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Keranamu Malaysia 🇲🇾</title>

<style>

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: Arial, Helvetica, sans-serif;
}

/* =========================
   START PAGE
========================= */

#start {
  position: fixed;
  inset: 0;

  background: #061a40;
  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  text-align: center;
}

.flag {
  font-size: 22vw;
}

#start h1 {
  font-size: 9vw;
  margin: 10px 15px;
}

#start p {
  font-size: 4.5vw;
  opacity: 0.75;
}

button {
  margin-top: 20px;

  padding: 18px 45px;

  border: none;
  border-radius: 100px;

  background: white;
  color: #061a40;

  font-size: 7vw;
  font-weight: 900;
}

/* =========================
   MAIN SCREEN
========================= */

#screen {
  position: fixed;
  inset: 0;

  display: none;

  align-items: center;
  justify-content: center;

  overflow: hidden;

  background: black;
  color: white;
}

/* =========================
   ERROR SCREEN
========================= */

#error {
  width: 100%;
  padding: 8vw;

  color: #00ff41;

  font-family: monospace;
  font-size: 5vw;
  line-height: 1.5;
}

#errorTitle {
  font-size: 11vw;
  font-weight: 900;
}

/* =========================
   GLITCH
========================= */

.glitch {
  animation: glitch 0.13s infinite;
}

@keyframes glitch {

  0% {
    transform: translate(0);
  }

  20% {
    transform: translate(-6px, 3px);
  }

  40% {
    transform: translate(7px, -3px);
  }

  60% {
    transform: translate(-4px, 5px);
  }

  80% {
    transform: translate(5px, -4px);
  }

  100% {
    transform: translate(0);
  }
}

/* =========================
   WORD
========================= */

#word {
  position: absolute;

  white-space: nowrap;

  font-size: 20vw;
  font-weight: 1000;

  text-align: center;

  text-shadow:
    4px 4px 12px rgba(0,0,0,0.35);
}

/* =========================
   SCROLL
========================= */

.scroll {
  animation: scrollText 3s linear infinite;
}

@keyframes scrollText {

  from {
    transform: translateX(120vw);
  }

  to {
    transform: translateX(-120vw);
  }
}

/* =========================
   PULSE
========================= */

.pulse {
  animation: pulse 0.8s ease-in-out infinite alternate;
}

@keyframes pulse {

  from {
    transform: scale(0.88);
  }

  to {
    transform: scale(1.08);
  }
}

/* =========================
   FADE IN
========================= */

.fade {
  animation: fade 1s ease forwards;
}

@keyframes fade {

  from {
    opacity: 0;
    transform: scale(0.8);
  }

  to {
    opacity: 1;
    transform: scale(1);
  }
}

</style>
</head>


<body>


<!-- =========================
     START SCREEN
========================= -->

<div id="start">

  <div class="flag">
    🇲🇾
  </div>

  <h1>
    KERANAMU MALAYSIA
  </h1>

  <p>
    Tunggu arahan sebelum tekan
  </p>

  <button onclick="mula()">
    MULA
  </button>

</div>



<!-- =========================
     MAIN DISPLAY
========================= -->

<div id="screen">

  <div id="error"></div>

  <div id="word"></div>

</div>



<!-- =========================
     GLITCH AUDIO
========================= -->

<audio
  id="glitchAudio"
  src="mixkit-small-electric-glitch-2595.wav"
  preload="auto">
</audio>



<script>

/* =========================
   ELEMENTS
========================= */

const start =
  document.getElementById("start");

const screen =
  document.getElementById("screen");

const errorBox =
  document.getElementById("error");

const word =
  document.getElementById("word");

const glitchAudio =
  document.getElementById("glitchAudio");



/* =========================
   START
========================= */

function mula() {

  start.style.display = "none";

  screen.style.display = "flex";



  /* FULL SCREEN */

  if (document.documentElement.requestFullscreen) {

    document.documentElement
      .requestFullscreen()
      .catch(() => {});

  }



  /* =========================
     0:00 — GLITCH SOUND
  ========================= */

  glitchAudio.currentTime = 0;

  glitchAudio.play()
    .catch(() => {});



  /* =========================
     0:00 — SYSTEM ERROR
  ========================= */

  screen.style.background = "black";

  errorBox.innerHTML = `

    <div id="errorTitle"
         class="glitch">

      SYSTEM ERROR

    </div>

    CONNECTION LOST...

    <br><br>

    Attempting recovery...

    <br>

    [■■□□□□□□□□] 20%

  `;



  /* =========================
     0:01 — IDENTITY ERROR
  ========================= */

  setTimeout(() => {

    playGlitchAgain();

    errorBox.innerHTML = `

      <div id="errorTitle"
           class="glitch">

        ERROR 404

      </div>

      IDENTITY NOT FOUND.

      <br><br>

      Searching system...

      <br>

      [■■■■■□□□□□] 50%

    `;

  }, 1000);



  /* =========================
     0:02 — JATI DIRI
  ========================= */

  setTimeout(() => {

    playGlitchAgain();

    errorBox.innerHTML = `

      <div id="errorTitle"
           class="glitch">

        CRITICAL ERROR

      </div>

      JATI DIRI NOT FOUND.

      <br><br>

      RECOVERING...

      <br>

      [■■■■■■■■□□] 80%

    `;

  }, 2000);



  /* =========================
     0:03 — ALMOST DONE
  ========================= */

  setTimeout(() => {

    errorBox.innerHTML = `

      RECOVERING SYSTEM...

      <br><br>

      [■■■■■■■■■■] 100%

    `;

  }, 3000);



  /* =========================
     0:04 — BLACKOUT
  ========================= */

  setTimeout(() => {

    errorBox.innerHTML = "";

    word.innerHTML = "";

    screen.style.background = "black";

  }, 4000);



  /* =========================
     0:04.5 — RESTORED
  ========================= */

  setTimeout(() => {

    playGlitchAgain();

    word.style.color = "#00ff41";

    word.style.fontSize = "10vw";

    word.className = "fade";

    word.innerHTML =
      "SYSTEM RESTORED ✓";

  }, 4500);



  /* =========================
     0:05 — MALAYSIA
  ========================= */

  setTimeout(() => {

    word.style.fontSize = "20vw";

    word.style.color = "white";

    word.innerHTML = "MALAYSIA";

    word.className = "scroll";

    startColours();

  }, 5000);



  /* =========================
     0:08 — BERSATU
  ========================= */

  setTimeout(() => {

    word.innerHTML =
      "BERSATU";

  }, 8000);



  /* =========================
     0:11 — JATI DIRI
  ========================= */

  setTimeout(() => {

    word.innerHTML =
      "JATI DIRI";

  }, 11000);



  /* =========================
     0:14 — FINAL
  ========================= */

  setTimeout(() => {

    stopColours();

    screen.style.background =
      "#0033A0";

    word.style.color =
      "white";

    word.style.fontSize =
      "17vw";

    word.className =
      "pulse";

    word.innerHTML =
      "🇲🇾";

  }, 14000);



  /* =========================
     0:15 — KERANAMU
  ========================= */

  setTimeout(() => {

    word.style.fontSize =
      "13vw";

    word.style.whiteSpace =
      "normal";

    word.style.width =
      "95%";

    word.innerHTML =
      "KERANAMU<br>MALAYSIA";

  }, 15000);

}



/* =========================
   REPLAY GLITCH SOUND
========================= */

function playGlitchAgain() {

  glitchAudio.pause();

  glitchAudio.currentTime = 0;

  glitchAudio.play()
    .catch(() => {});

}



/* =========================
   MALAYSIA COLOURS
========================= */

const colours = [

  "#D71920",  // RED 🇲🇾

  "#0033A0",  // BLUE 🇲🇾

  "#FFD100",  // YELLOW 🇲🇾

  "#FFFFFF"   // WHITE 🇲🇾

];

let colourInterval;



function startColours() {

  let i = 0;

  colourInterval =
    setInterval(() => {

      const colour =
        colours[i];

      screen.style.background =
        colour;



      /* DARK TEXT ON LIGHT COLOURS */

      if (
        colour === "#FFFFFF" ||
        colour === "#FFD100"
      ) {

        word.style.color =
          "#061A40";

      }

      else {

        word.style.color =
          "white";

      }


      i =
        (i + 1) %
        colours.length;

    }, 900);

}



function stopColours() {

  clearInterval(
    colourInterval
  );

}

</script>

</body>
</html>
